<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121324"/>
      <stop offset="50%" stop-color="#080911"/>
      <stop offset="100%" stop-color="#190a28"/>
    </linearGradient>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#8338ec"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle/Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#neon-grad)" stroke-width="6" opacity="0.4" />

  <!-- Neon Music Notes / Soundwave Icon -->
  <g filter="url(#glow)" transform="translate(40, 30)">
    <!-- Equalizer Waves -->
    <path d="M 100 280 C 120 220, 140 340, 160 280 C 180 220, 200 340, 220 280 C 240 220, 260 340, 280 280 C 300 220, 320 340, 340 280" fill="none" stroke="url(#neon-grad)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Music Note 1 -->
    <circle cx="160" cy="280" r="32" fill="url(#neon-grad)" />
    <path d="M 188 280 L 188 130 C 188 130, 240 110, 290 140 L 290 200 C 240 170, 188 185, 188 185" fill="url(#neon-grad)" />
    <circle cx="262" cy="250" r="28" fill="url(#neon-grad)" />
    <path d="M 286 250 L 286 140" stroke="url(#neon-grad)" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
